name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: bun run lint

      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck

  go-test:
    runs-on: ubuntu-latest
    needs: [frontend-check]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend (needed for go:embed)
        working-directory: frontend
        run: bun run build

      - name: Download Go dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

  go-build:
    runs-on: ubuntu-latest
    needs: [go-test]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend (needed for go:embed)
        working-directory: frontend
        run: bun run build

      - name: Download Go dependencies
        run: go mod download

      - name: Build
        run: go build ./...

  linux-portable-build:
    runs-on: ubuntu-latest
    needs: [frontend-check]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config build-essential

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend for Go embed
        working-directory: frontend
        run: bun run build

      - name: Build portable Linux executable
        run: wails build -platform linux/amd64 -tags webkit2_41 -clean

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: adbkit-linux-amd64
          path: build/bin/ADBKit

  windows-portable-build:
    runs-on: windows-latest
    needs: [frontend-check]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Verify frontend
        working-directory: frontend
        run: |
          bun run test
          bun run lint
          bun run typecheck

      - name: Build frontend for Go embed
        working-directory: frontend
        run: bun run build

      - name: Run Go tests
        run: go test ./...

      - name: Build portable Windows executable
        run: wails build -platform windows/amd64 -clean

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: adbkit-windows-amd64
          path: build/bin/ADBKit.exe

  windows-signed-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build signed release candidate
        run: wails build -platform windows/amd64 -clean

      - name: Sign and verify executable
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) {
            throw "Windows signing certificate secrets are required."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "adbkit-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
            $timestampUrl = $env:WINDOWS_TIMESTAMP_URL
            if ([string]::IsNullOrWhiteSpace($timestampUrl)) {
              $timestampUrl = "http://timestamp.digicert.com"
            }
            signtool sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD /tr $timestampUrl /td SHA256 build/bin/ADBKit.exe
            signtool verify /pa /all /v build/bin/ADBKit.exe
          }
          finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $certificatePath
          }

      - name: Upload signed executable
        uses: actions/upload-artifact@v4
        with:
          name: adbkit-windows-amd64-signed
          path: build/bin/ADBKit.exe

  linux-packages:
    runs-on: ubuntu-latest
    needs: [go-build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config build-essential

      - name: Install packaging tools
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend for Go embed
        working-directory: frontend
        run: bun run build

      - name: Build Linux executable
        run: wails build -platform linux/amd64 -tags webkit2_41 -clean

      - name: Build DEB package
        run: |
          mkdir -p dist
          sed 's/^version: .*/version: "2.0.0~beta4"/' nfpm.yaml > /tmp/nfpm-deb.yaml
          ~/go/bin/nfpm package -p deb -f /tmp/nfpm-deb.yaml -t dist/

      - name: Build RPM package
        run: |
          mkdir -p dist
          sed 's/^version: .*/version: "2.0.0~beta4"/' nfpm.yaml > /tmp/nfpm-rpm.yaml
          ~/go/bin/nfpm package -p rpm -f /tmp/nfpm-rpm.yaml -t dist/

      - name: Build AppImage
        run: VERSION=2.0.0-beta4 bash scripts/build-appimage.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: adbkit-linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
