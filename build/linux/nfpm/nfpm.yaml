name: adbkit
arch: ${GOARCH}
platform: linux
version: "2.1.0"
section: utils
priority: optional
maintainer: "Drenzzz <realdrenzzz@gmail.com>"
description: "Modern desktop toolkit for ADB, Fastboot, and scrcpy"
vendor: "Drenzzz"
homepage: "https://github.com/drenzzz/ADBKit"
license: "MIT"
provides:
  - adbkit

contents:
  - src: "./bin/adbkit"
    dst: /usr/bin/adbkit
  - src: "./build/linux/com.drenzzz.adbkit.desktop"
    dst: /usr/share/applications/com.drenzzz.adbkit.desktop
  - src: "./build/linux/icons/16x16/apps/com.drenzzz.adbkit.png"
    dst: /usr/share/icons/hicolor/16x16/apps/com.drenzzz.adbkit.png
  - src: "./build/linux/icons/24x24/apps/com.drenzzz.adbkit.png"
    dst: /usr/share/icons/hicolor/24x24/apps/com.drenzzz.adbkit.png
  - src: "./build/linux/icons/32x32/apps/com.drenzzz.adbkit.png"
    dst: /usr/share/icons/hicolor/32x32/apps/com.drenzzz.adbkit.png
  - src: "./build/linux/icons/48x48/apps/com.drenzzz.adbkit.png"
    dst: /usr/share/icons/hicolor/48x48/apps/com.drenzzz.adbkit.png
  - src: "./build/linux/icons/64x64/apps/com.drenzzz.adbkit.png"
    dst: /usr/share/icons/hicolor/64x64/apps/com.drenzzz.adbkit.png
  - src: "./build/linux/icons/128x128/apps/com.drenzzz.adbkit.png"
    dst: /usr/share/icons/hicolor/128x128/apps/com.drenzzz.adbkit.png
  - src: "./build/linux/icons/256x256/apps/com.drenzzz.adbkit.png"
    dst: /usr/share/icons/hicolor/256x256/apps/com.drenzzz.adbkit.png
  - src: "./build/linux/icons/512x512/apps/com.drenzzz.adbkit.png"
    dst: /usr/share/icons/hicolor/512x512/apps/com.drenzzz.adbkit.png

depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
