name: ADBKit
arch: amd64
platform: linux
version: "0.0.0"
section: utils
priority: optional
maintainer: "Drenzzz <realdrenzzz@gmail.com>"
description: "ADBKit — modern Android device management desktop app"
vendor: "Drenzzz"
homepage: "https://github.com/drenzzz/adbkit"
license: "MIT"

depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

contents:
  - src: ./build/bin/ADBKit
    dst: /usr/bin/ADBKit
  - src: ./build/linux/ADBKit.desktop
    dst: /usr/share/applications/ADBKit.desktop
  - src: ./build/appicon.png
    dst: /usr/share/icons/hicolor/256x256/apps/ADBKit.png
